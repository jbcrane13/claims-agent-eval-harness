name: evals

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install
        run: uv sync --locked
      - name: Unit and contract tests
        run: uv run pytest -q
      - name: Run eval suite (simulated model, 3 runs per case)
        run: uv run claims-eval run --model sim:careful
      - name: Release gate
        run: uv run claims-eval gate --summary "$GITHUB_STEP_SUMMARY"
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: results/
