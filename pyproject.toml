[project]
name = "claims-eval"
version = "0.1.0"
description = "Evaluation harness for a claims-pend agent that reaches a mock Facets system through MCP."
readme = "README.md"
authors = [{ name = "Blake Crane" }]
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3.0",
]

[project.optional-dependencies]
# Only needed for live model runs. CI uses the simulated model and needs neither.
live = [
    "anthropic>=2.3.0",
    "google-genai>=2.33.0",
]

[project.scripts]
claims-eval = "claims_eval.cli:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
